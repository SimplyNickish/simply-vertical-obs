SettingsTriesNote="If your internet drops, your vertical tries to reconnect this many times before it stops. Set it to 0 to stop straight away."
SettingsWait="Wait between tries"
SettingsSoundQuality="Sound quality"
SettingsSoundQualityNote="160 suits talking and games. Pick 192 or 320 if music matters on your stream. Higher uses a little more internet."
SettingsSize="Picture size"
SettingsSizeNote="1080 x 1920 is full quality. Smaller sizes are lighter on your PC and need less internet, so they suit slower connections. About 4500 kbps suits 900 x 1600, and 3500 suits 720 x 1280."
SettingsFps="Frames per second"
SettingsFpsNote="How many pictures a second your vertical sends. 60 looks smoothest in fast games; 30 uses less internet and works your PC less. Your vertical runs on OBS's clock, so it can match OBS's frame rate (OBS Settings, Video) or an even share of it."
SettingsFileType="File type"
SettingsFileTypeNote="MP4 plays everywhere and uploads straight to TikTok, YouTube and Instagram. OBS writes it in a crash safe way, so a crash does not lose the recording. MKV needs converting before most sites take it. MOV suits Apple editing apps like Final Cut. Backtrack clips are always MP4."
SettingsRecQuality="Recording quality"
SettingsRecSame="Same as stream"
SettingsRecQualityNote="Same as stream uses no extra power. CBR (constant bitrate) uses the same kbps every second, so the file size is easy to predict. VBR (variable bitrate) aims for the kbps you type and goes up to half as high again in busy moments, so fast action stays sharp. CQP (called CRF on the x264 encoder) keeps the picture equally sharp all the way through and lets the file grow as big as it needs: type a level from 1 to 51, lower is sharper. Anything but Same as stream runs a second encoder, which works your graphics card a little harder."
SettingsAutoBacktrack="Start Backtrack by itself"
SettingsAutoNever="Never"
SettingsAutoOpen="When OBS opens"
SettingsAutoLive="When I go live"
SettingsAutoBacktrackNote="So you never miss a clip because Backtrack was off. When OBS opens keeps it running the whole time OBS is open, which uses your graphics card all that time. When I go live starts it with your first stream and stops it when your last stream ends. If you start Backtrack yourself, it runs until you turn it off."
