SettingsRecCanvases="Pictures to record"
SettingsRecCanvasesNote="Each picture switched on here becomes a file of its own when you press Record, all starting and stopping together, in the same folder and with the same time in their names: Vertical for Main, Vertical and the canvas name for your other canvases, Horizontal for OBS horizontal (your normal OBS scene, at OBS's own size). Split, pause and markers work on all of them at once. Each picture is one more video for your graphics card to make. If OBS's own recording is already running, OBS horizontal is left out, since OBS is recording that picture itself. At least one stays on."
SettingsRecCanvas="Canvas to record"
