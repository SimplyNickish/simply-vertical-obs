SettingsReplayLineNote="A lit line in your colour under the REPLAY tag fills up as the replay plays, so viewers can see how long is left."
SettingsReplayCamLive="Keep my facecam live"
SettingsReplayCamLiveNote="For replays over the whole canvas: your live facecam stays on top in its own shape, so viewers still see you react. The zoom then pushes in on the game alone."
ReplayWindowName="Simply Vertical Replay Window"
