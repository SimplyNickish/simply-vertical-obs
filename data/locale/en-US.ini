SettingsReplaySlow="Slow motion"
SettingsReplaySlowNote="How slow the replay gets. 50% plays at half speed, 25% at a quarter. Off plays it all at normal speed."
SettingsReplaySlowWhat="What slows down"
SettingsReplaySlowWhatNote="The moment: the replay plays at normal speed, then slows down just before you pressed Save clip, so viewers see the build up and then the big moment in slow motion. The whole replay: all of it plays slow. When I press: the replay plays at normal speed, and a Slow motion key shows under the canvas while it plays (also an OBS hotkey, a Stream Deck key and /replay?do=slow). Press it when the moment comes and it slows from about a second before."
SettingsReplaySlowLength="Slow down this long"
SettingsReplaySlowLengthNote="The moment: how many seconds before you pressed Save clip the slow motion starts, and the replay ends the same number of seconds after the press. When I press: how many seconds after your press it stays slow before going back to normal speed. With The moment it changes speed on the nearest full picture in the clip, so it can be up to about a second earlier or later than this."
SettingsReplaySound="Play last clip with its sound"
SettingsReplaySoundNote="Plays the clip's sound on the vertical only. This needs the vertical's own sound mix, switched on in the Sound tab, so your main stream never hears it. Without it, replays play silent."
SettingsReplayLength="Replay length"
SettingsReplayLengthNote="How much of the end of your clip Play last clip shows, so viewers see the moment, not the whole Backtrack. Whole clip plays all of it."
