SettingsSoundQualityNote="160 suits talking and games. Pick 192 or 320 if music matters on your stream. Higher uses a little more internet."
SettingsSize="Picture size"
SettingsSizeNote="1080 x 1920 is full quality. Smaller sizes are lighter on your PC and need less internet, so they suit slower connections. About 4500 kbps suits 900 x 1600, and 3500 suits 720 x 1280."
SettingsFps="Frames per second"
SettingsFpsNote="How many pictures a second your vertical sends. 60 looks smoothest in fast games; 30 uses less internet and works your PC less. Your vertical runs on OBS's clock, so it can match OBS's frame rate (OBS Settings, Video) or an even share of it."
SettingsFileType="File type"
SettingsFileTypeNote="MP4 plays everywhere and uploads straight to TikTok, YouTube and Instagram. OBS writes it in a crash safe way, so a crash does not lose the recording. MKV needs converting before most sites take it. MOV suits Apple editing apps like Final Cut. Backtrack clips are always MP4."
SettingsCodec="Video format"
SettingsCodecNote="The format your recordings and Backtrack clips are saved in. H.264 opens in every app and on every phone. HEVC and AV1 look sharper at the same file size, but need a newer graphics card (NVIDIA RTX 40 or newer for AV1, GTX 10 or newer for HEVC, or a recent AMD or Intel card). Your streams always stay H.264, because TikTok, Instagram, Kick and Twitch only take H.264. Recording in HEVC or AV1 while you stream means your graphics card makes two pictures, which costs a little more."
SettingsCodecH264="Plays everywhere. The safe choice."
SettingsCodecHevc="Sharper than H.264 at the same size. Plays on most phones and in most editing apps. Older Windows PCs may need the free HEVC Video Extensions to play it."
SettingsCodecAv1="The sharpest at the same size. YouTube and modern browsers play it. Some editing apps and older phones cannot open it yet."
SettingsCodecCannot="Your graphics card cannot make %1, so recordings and clips stay H.264. To use it, pick a graphics card encoder under Video encoder on the Picture tab, or keep H.264."
SettingsCodecYouTube="Use it for YouTube streams too"
SettingsCodecYouTubeNote="YouTube takes HEVC and AV1 streams and shows them sharper at the same internet speed. Every other platform keeps getting H.264. Your graphics card then makes two pictures while you stream to YouTube, which costs a little more. If YouTube ever turns the stream down, switch this off."
SettingsRecQuality="Recording quality"
SettingsRecSame="Same as stream"
SettingsRecQualityNote="Same as stream records at your stream's quality. On a graphics card encoder the recording always runs its own encoder, so you can pause it without freezing your live streams or Backtrack. That means your graphics card makes two pictures while you record and stream at the same time (most cards handle it easily), and only one when you just record or just stream. On the processor encoder (x264), Same as stream shares the stream's encoder and costs nothing extra; pause is a graphics card feature, so there is no Pause key on x264. CBR (constant bitrate) uses the same kbps every second, so the file size is easy to predict. VBR (variable bitrate) aims for the kbps you type and goes up to half as high again in busy moments, so fast action stays sharp. CQP (called CRF on the x264 encoder) keeps the picture equally sharp all the way through and lets the file grow as big as it needs: type a level from 1 to 51, lower is sharper. Anything but Same as stream runs a second encoder, which works your graphics card a little harder."
