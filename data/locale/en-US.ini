SettingsSplit="Split into parts"
SettingsSplitNever="Never"
SettingsSplitTime="By time"
SettingsSplitSize="By size"
SettingsSplitNote="Starts a new file every so often, so one long stream does not become one huge file. Nothing is lost between the parts."
SettingsTracks="Sound tracks in the file"
SettingsTracksNote="Each column is one of OBS's six sound tracks and each row is a sound. A lit diamond means that sound is on that track: click a crossing to put the sound on the track or take it off. Along the bottom, In the file puts that track in your recordings and Backtrack clips as its own track, so you can fix the mix when editing, for example your mic on its own. Your vertical's sound is always in the file. Changes here change OBS too (the same as Edit, Advanced Audio Properties), so your main stream and recordings hear them as well. Nothing changes until you press Save."
SettingsTrackMainTip="This is your vertical's sound, so it is always in the file. Change it on the Sound tab."
SettingsRecCanvas="Canvas to record"
SettingsRecCanvasNote="Which of your canvases goes in your recordings. Main records your main vertical. Pick another canvas to record exactly what that platform sees, for example your Twitch canvas with its chat commands. Recording another canvas runs an encoder of its own, which works your graphics card a little harder."
SettingsRecGame="Put the game's name in file names"
SettingsGameNote="Adds the game you are playing to the name, read from your Game Capture, so files are easy to find later. When no game is being captured, the name stays as normal."
SettingsClipCanvas="Canvas for clips"
SettingsClipCanvasNote="Which of your canvases Backtrack keeps for Save clip. Main keeps your main vertical. Keeping another canvas runs an encoder of its own, which works your graphics card a little harder."
SettingsAfter="Keep going after Save clip"
SettingsAfterNote="Keeps recording this many seconds after you press Save clip, so the end of the moment is not cut off. Off saves straight away."
SettingsMemory="Memory limit"
SettingsMemoryNote="The most memory Backtrack may use. When it is full, the oldest part is dropped, so clips can come out shorter than the length above. No limit always keeps the full length."
SettingsClipQuality="Clip quality"
SettingsClipAsRec="Same as recordings"
SettingsClipQualityNote="Same as recordings uses your Recording quality. Same as stream uses no extra power. CBR, VBR and CQP (CRF on x264) work as they do for recordings and give clips their own quality, which runs an encoder of their own and works your graphics card a little harder."
