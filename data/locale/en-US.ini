HelpYouTube="In YouTube Studio press Create, then Go live, and copy your stream key here. The server is already filled in."
HelpYouTubeMore="Horizontal and vertical as one YouTube live: in Live Control Room open the Stream tab, set Vertical canvas to Encoder, and in the Stream key list for the vertical pick or create a second key. Copy that second key here, never the one OBS uses. Do it before you go live, YouTube cannot add the vertical once the stream has started. Then turn on Start with OBS (Settings, Stream tab) so both go live together. Phone viewers get the vertical, in Shorts too, but it has no clickable links and no mid-roll ads."
HelpTwitch="Press Get my key to fill it in, or copy the Primary Stream Key from your Twitch Creator Dashboard (Settings, Stream). The server is already filled in."
HelpTwitchMore="Get my key uses the Twitch account you connected on your SimplyNickish dashboard. Twitch takes one stream per channel, so this only works when you are not also streaming your normal horizontal picture to the same Twitch channel."
HelpTikTok="TikTok shows a server and key on its LIVE page if your account has access to them. They change every time you go live, so press Edit and paste the new ones each time."
