CamNone="No camera"
RouteHeadSub="You already have %1."
SeeHead="See it working"
SeeBody="This is your vertical, live, with your layout from the website. Change anything on the website and it changes here straight away."
PlatHead="Where you go live"
PlatKeys="Twitch and Kick: press Get my key and it fills in by itself. The others: press Open my key page, copy the key and paste it in."
ReadyHead="You're ready"
ReadyOwn="Press Go live at the top of the Simply Vertical panel. It goes live on every app you added, and asks first, so a stray click never starts your stream."
ReadyOther="Go live from %1 as you do now. Your layout is in its vertical."
ReadyNoPlatforms="Add where you go live any time: the small arrow beside Go live in the panel, then Add a platform."
DestKeyPage="Open my key page"
DestKeyPageTip="Opens the page where %1 shows your stream key, in your browser."
DestKeyLooksWrong="That looks like a server address, or it has spaces in it. Paste only the stream key here."
TourMenu="Show me around"
TourSkip="Skip tour"
TourDone="Done"
TourCount="%1 of %2"
TourPhoneHead="Your vertical"
TourPhone="This is exactly what your viewers see. Change your layout on the website and it changes here straight away."
TourGoHead="Go live"
TourGo="Goes live on every app you added. It asks first, so a stray click never starts your stream. While you are live it turns red: press it again to stop."
TourMoreHead="Your platforms"
TourMore="Go live on just one app, switch one off for Go live, or add another."
TourRecHead="Record"
TourRec="Records your vertical to a file on this PC, ready to post as a Short, Reel or TikTok."
TourBtHead="Backtrack"
TourBt="Keeps the last minute in the background, ready for a clip. The line under it says how much is ready."
TourLayoutsHead="Layouts"
TourLayouts="The layout showing right now. The arrows step to the one before or after; click the name to see them all, or let it follow your game by itself."
TourClipHead="Save clip"
TourClip="After a great moment, press Save clip. It lights up once Backtrack is on. The key beside it saves the clip and replays it straight away."
TourReplayHead="Replay"
TourReplay="Plays your last clip on your vertical, then goes back to your layout by itself. The arrow opens your recent clips."
TourSceneHead="Edit scene"
TourScene="Your vertical's scenes and the sources in them. Either list can pop out into an OBS panel of its own."
TourGuidesHead="Guides"
TourGuides="Shows where each phone app's buttons and chat sit over your picture, so nothing important hides behind them. Only you see these."
TourMenuHead="Settings and menu"
TourMenuText="Settings, live stats, setup, this tour and Help are all in here."
