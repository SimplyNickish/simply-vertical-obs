LinkBody="This connects OBS to your Simply Vertical account, so the layout you make on the website shows here."
LinkCodeSay="A page opened in your browser. Type this code there, then press Approve. This moves on by itself once you have."
LinkAgain="Start again"
LinkDone="Linked to %1"
LinkDoneNoName="Linked"
GameHead="Which one is your game?"
